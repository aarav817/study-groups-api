<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Study App - Create Account</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Header -->
  <header class="top-header">
    <a href="index.html" class="brand">
      Study App <span class="brand-badge">PROTOTYPE</span>
    </a>
    <nav class="header-nav">
      <a href="login.html">Sign In</a>
    </nav>
  </header>

  <div class="auth-container">
    <h1 style="font-size: 1.5rem; font-weight: 700; text-align: center; margin-bottom: 0.25rem;">Create Account</h1>
    <p style="font-size: 0.875rem; color: var(--text-muted); text-align: center; margin-bottom: 1.5rem;">Join study groups and start collaborating</p>

    <form action="groups.html" method="GET">
      <div class="form-group">
        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" placeholder="Alex Morgan" value="Alex Morgan" required>
      </div>

      <div class="form-group">
        <label for="email">University Email</label>
        <input type="email" id="email" name="email" placeholder="alex@stanford.edu" value="alex@stanford.edu" required>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" value="••••••••••••" required>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">Create Account & Enter App</button>
    </form>

    <div style="text-align: center; margin-top: 1.5rem; font-size: 0.875rem;">
      Already have an account? <a href="login.html" style="color: var(--primary-color); font-weight: 500;">Sign In</a>
    </div>
  </div>

</body>
</html>
