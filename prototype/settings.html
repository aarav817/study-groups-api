<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Study App - Settings</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app-container">
    <!-- Top Header -->
    <header class="top-header">
      <a href="groups.html" class="brand">
        Study App <span class="brand-badge">PROTOTYPE</span>
      </a>
      <nav class="header-nav">
        <a href="settings.html" class="active">Settings</a>
        <a href="account.html">Account</a>
        <a href="index.html" class="btn-logout">Log Out</a>
      </nav>
    </header>

    <div class="main-body">
      <!-- Sidebar Navigation -->
      <aside class="sidebar">
        <nav>
          <a href="groups.html">
            <span>Groups</span>
            <span class="nav-counter">3</span>
          </a>
          <a href="calendar.html">Calendar</a>
          <a href="materials.html">Materials Library</a>
          <a href="messages.html">Messages</a>
        </nav>
      </aside>

      <!-- Main Content Area -->
      <main class="content-area">
        <h2 class="page-title" style="margin-bottom: 1.5rem;">Settings</h2>

        <div class="card" style="max-width: 600px;">
          <h3 class="card-title">Preferences</h3>
          
          <div class="form-group">
            <label for="notifications">Email Notifications</label>
            <select id="notifications">
              <option>All new messages and events</option>
              <option>Only important reminders</option>
              <option>None</option>
            </select>
          </div>

          <div class="form-group">
            <label for="privacy">Group Privacy</label>
            <select id="privacy">
              <option>Public (Anyone can request to join)</option>
              <option>Private (Invite only)</option>
            </select>
          </div>

          <button class="btn btn-primary" onclick="alert('Settings saved successfully!')">Save Settings</button>
        </div>
      </main>
    </div>
  </div>

</body>
</html>
